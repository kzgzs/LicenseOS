; ============================================
; LicenseOS V3.2 - Supervisor Queue Workers
; ============================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; --- Default Queue Worker (orders, licenses, commissions) ---
[program:queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=60 --memory=128
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/queue-default.log
stopwaitsecs=60

; --- High Priority Queue (payments, webhooks) ---
[program:queue-high]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --queue=high,default --sleep=1 --tries=5 --timeout=90 --memory=256
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/queue-high.log
stopwaitsecs=90

; --- Failed Job Retry ---
[program:queue-retry]
process_name=%(program_name)s
command=php /var/www/artisan queue:retry --all
autostart=false
autorestart=false
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/queue-retry.log

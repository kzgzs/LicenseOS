# ============================================
# LicenseOS V3.2 - Nginx Production Config
# ============================================

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/m;

# Upstream PHP-FPM
upstream php_app {
    server app:9000;
}

# HTTP -> HTTPS redirect (enable after SSL setup)
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;  # Enable after SSL setup

    server_name your-domain.com;

    root /var/www/public;
    index index.php;

    # --- SSL (enable after certbot) ---
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Max upload size ---
    client_max_body_size 64M;

    # --- Logs ---
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # --- Main location ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP FastCGI ---
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php_app;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "max_execution_time=60";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60;
    }

    # --- API rate limiting ---
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Webhook rate limiting (stricter) ---
    location /api/v2/webhook/ {
        limit_req zone=webhook_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Filament admin panel ---
    location /admin {
        # Optional: IP restriction for admin
        # allow 1.2.3.4;
        # deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Static assets (caching) ---
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Block sensitive files ---
    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /storage/logs/ {
        deny all;
    }

    # --- PHP-FPM status (internal only) ---
    location /fpm-status {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_pass php_app;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # --- Health check endpoint ---
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

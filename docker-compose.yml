# ============================================
# LicenseOS V3.2 - Production Docker Compose
# ============================================

services:

  # --- Application (PHP-FPM) ---
  app:
    build:
      context: .
      target: base
    container_name: licenseos_app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - storage_data:/var/www/storage/app
      - log_data:/var/log/php
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - licenseos_net
    env_file:
      - .env

  # --- Queue Worker (Supervisor) ---
  queue:
    build:
      context: .
      target: queue
    container_name: licenseos_queue
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - storage_data:/var/www/storage/app
      - log_data:/var/log/php
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - licenseos_net
    env_file:
      - .env

  # --- Scheduler (Cron) ---
  scheduler:
    build:
      context: .
      target: scheduler
    container_name: licenseos_scheduler
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - storage_data:/var/www/storage/app
    depends_on:
      - app
    networks:
      - licenseos_net
    env_file:
      - .env

  # --- Nginx (Reverse Proxy + HTTPS) ---
  nginx:
    image: nginx:1.25-alpine
    container_name: licenseos_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - storage_data:/var/www/storage/app
    depends_on:
      - app
    networks:
      - licenseos_net

  # --- MySQL 8 ---
  db:
    image: mysql:8.0
    container_name: licenseos_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-licenseos}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ChangeMeInProduction}
      MYSQL_USER: ${DB_USERNAME:-licenseos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ChangeMeInProduction}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - licenseos_net

  # --- Redis (Queue + Cache + Session) ---
  redis:
    image: redis:7-alpine
    container_name: licenseos_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - licenseos_net

  # --- Meilisearch (Search Engine) ---
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: licenseos_search
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKeyChangeMe}
      MEILI_ENV: production
    volumes:
      - search_data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    networks:
      - licenseos_net

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  search_data:
    driver: local
  storage_data:
    driver: local
  log_data:
    driver: local

networks:
  licenseos_net:
    driver: bridge
